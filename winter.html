<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>하얗게 눈 내리는 정원</title>

  <!-- Pretendard 폰트 추가 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden; /* 스크롤바 제거 */
      background-color: #000; /* 비디오 로딩 전/여백 기본 배경색 */
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    /* 비디오 컨테이너 및 비디오 스타일 */
    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .fullscreen-video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      /* 화면 비율에 맞춰 여백 없이 꽉 채우기 */
      object-fit: cover; 
      transform: translate(-50%, -50%);
      will-change: opacity;
      transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* 1. 기본 배경 영상 (winter.mp4) */
    #bgVideo {
      z-index: 1;
      opacity: 1;
    }

    #bgVideo.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* 2. 줌 영상 (winter zooom.mp4) */
    #zoomVideo {
      z-index: 2;
      opacity: 0;
    }

    #zoomVideo.active {
      z-index: 5;
      opacity: 1;
    }

    /* 3. 의자 이동 영상 (winter z to chair.mp4) */
    #chairVideo {
      z-index: 3;
      opacity: 0;
    }

    #chairVideo.active {
      z-index: 10;
      opacity: 1;
    }

    /* 4. 집 이동 영상 (winter z to home.mp4) */
    #homeTransitionVideo {
      z-index: 3;
      opacity: 0;
    }

    #homeTransitionVideo.active {
      z-index: 10;
      opacity: 1;
    }

    /* 5. 최종 무한 루프 눈 내리는 영상 (winter snow.mp4) */
    #snowVideo {
      z-index: 4;
      opacity: 0;
    }

    #snowVideo.active {
      z-index: 15;
      opacity: 1;
    }

    /* ★ Click 위치 조절 레이어 ★ */
    .content-overlay {
      position: absolute;
      z-index: 30; 
      pointer-events: none;
      top: 80%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .content-overlay.hidden {
      opacity: 0;
      transform: translate(-50%, -40%) scale(0.9);
      pointer-events: none;
    }

    /* 맑고 투명한 파스텔 글래스모피즘 버튼 */
    .pure-glass-btn {
      pointer-events: auto;
      width: 80px;
      height: 32px;
      border-radius: 20px;
      font-family: 'Pretendard', sans-serif;
      font-weight: 500; 
      font-size: 12.5px;
      color: #ffffff;      
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.25); 
      letter-spacing: -0.2px;
      display: inline-flex; 
      justify-content: center; 
      align-items: center;
      padding: 0;
      position: relative;

      background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.02) 55%, rgba(255, 255, 255, 0.08) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 
        0 0 10px rgba(255, 200, 220, 0.15), 
        0 0 15px rgba(160, 230, 255, 0.15), 
        2px 5px 12px rgba(0, 0, 0, 0.1), 
        inset 1px 1px 1.5px rgba(255, 255, 255, 0.8), 
        inset -1px -1.5px 4px rgba(255, 255, 255, 0.2);

      cursor: pointer; 
      outline: none;
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      overflow: hidden; 
      user-select: none;
    }

    .pure-glass-btn::before {
      content: '';
      position: absolute;
      top: -1px; left: -1px; right: -1px; bottom: -1px;
      border-radius: 20px;
      background: conic-gradient(
        from 130deg at 50% 50%, 
        rgba(255, 180, 210, 0.2) 0deg, 
        rgba(255, 235, 170, 0.25) 70deg, 
        rgba(150, 240, 210, 0.25) 150deg, 
        rgba(140, 210, 255, 0.2) 230deg, 
        rgba(220, 180, 255, 0.2) 300deg, 
        rgba(255, 180, 210, 0.2) 360deg
      );
      -webkit-mask: radial-gradient(circle, transparent 60%, #000 70%);
      mask: radial-gradient(circle, transparent 60%, #000 70%);
      pointer-events: none; 
      opacity: 0.6;
      filter: blur(1.5px);
    }

    .pure-glass-btn::after {
      content: '';
      position: absolute;
      top: 8%; left: 12%;
      width: 38%; height: 35%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0.15) 50%, transparent 80%);
      transform: rotate(-15deg);
      pointer-events: none; 
      filter: blur(0.5px);
    }

    .pure-glass-btn:hover {
      transform: scale(1.05);
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 
        0 0 14px rgba(255, 180, 220, 0.25), 
        0 0 20px rgba(150, 220, 255, 0.25), 
        3px 8px 16px rgba(0, 0, 0, 0.12), 
        inset 1px 1.5px 3px rgba(255, 255, 255, 0.9), 
        inset -1px -2px 6px rgba(255, 255, 255, 0.3);
    }

    .pure-glass-btn:active {
      transform: scale(0.95);
    }

    /* ==========================================
        여리한 홀로그램 글래스모피즘 원형 버튼 스타일
    ========================================== */
    .action-glass-btn {
      position: absolute;
      z-index: 20;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      outline: none;
      user-select: none;
      pointer-events: auto;
      
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);

      background: radial-gradient(
        circle at 30% 20%,
        rgba(255, 225, 235, 0.38) 0%,   /* 상단 좌측 여리한 피치 핑크 반사광 */
        rgba(215, 240, 255, 0.18) 45%,  /* 중앙 은은한 쿨 소다 블루 반사광 */
        rgba(255, 255, 255, 0.05) 75%,  /* 하단 매우 투명한 유리 바디 */
        rgba(255, 210, 240, 0.12) 100%  /* 하단 끝 여운의 보라빛 반사광 */
      );

      border: 1px solid rgba(255, 255, 255, 0.45);

      box-shadow: 
        0 0 14px rgba(255, 215, 230, 0.28),    /* 은은한 핑크 글로우 */
        0 0 22px rgba(180, 235, 255, 0.22),    /* 은은한 블루 글로우 */
        0 6px 16px rgba(0, 0, 0, 0.25),        /* 기초 드롭 쉐도우 */
        inset 1.2px 1.5px 2px rgba(255, 255, 255, 0.9),  /* 상단 하이라이트 광택선 */
        inset -1.5px -2.5px 4px rgba(255, 200, 230, 0.3);  /* 하단 반사 굴절 빛 */

      opacity: 0.88;
      transform: translate(-50%, -50%) scale(1);
      transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* 초기 상태: 영상 진행 중 숨김 */
    .action-glass-btn.hidden {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: translate(-50%, -50%) scale(0.7) !important;
    }

    .action-glass-btn:hover {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.18);
      border-color: rgba(255, 255, 255, 0.75);

      background: radial-gradient(
        circle at 30% 20%,
        rgba(255, 230, 242, 0.55) 0%,
        rgba(200, 242, 255, 0.3) 50%,
        rgba(255, 255, 255, 0.12) 80%,
        rgba(240, 210, 255, 0.25) 100%
      );

      box-shadow: 
        0 0 20px rgba(255, 205, 225, 0.5),
        0 0 30px rgba(175, 235, 255, 0.4),
        0 8px 24px rgba(0, 0, 0, 0.3),
        inset 1.5px 2px 3px rgba(255, 255, 255, 1),
        inset -2px -2.5px 6px rgba(255, 180, 220, 0.45);
    }

    .action-glass-btn:active {
      transform: translate(-50%, -50%) scale(0.92);
    }

    /* 원형 버튼 위치 지정 */
    #leftBtn {
      top: 70%;
      left: 20%;
    }

    #chairBtn {
      top: 63%;
      left: 60%;
    }

    .home-glass-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 50;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.05) 60%, rgba(255, 255, 255, 0.15) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow:
        0 0 12px rgba(255, 255, 255, 0.2),
        2px 6px 14px rgba(0, 0, 0, 0.15),
        inset 1px 1px 2px rgba(255, 255, 255, 0.8),
        inset -1px -1px 4px rgba(255, 255, 255, 0.2);
      cursor: pointer;
      outline: none;
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      pointer-events: auto;
    }

    .home-glass-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
      transition: transform 0.3s ease;
    }

    .home-glass-btn:hover {
      transform: scale(1.1);
      box-shadow:
        0 0 16px rgba(255, 255, 255, 0.4),
        4px 8px 20px rgba(0, 0, 0, 0.2),
        inset 1px 1.5px 3px rgba(255, 255, 255, 0.95);
    }

    .home-glass-btn:hover svg {
      transform: scale(1.08);
    }

    .home-glass-btn:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <div class="video-container">
    <button id="homeBtn" class="home-glass-btn" aria-label="메인 화면 세 번째 섹션으로 이동">
      <svg viewBox="0 0 24 24">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
    </button>

    <!-- 5. 무한 루프 눈 내리는 비디오 -->
    <video id="snowVideo" class="fullscreen-video" loop muted playsinline preload="auto">
      <source src="winter snow.mp4" type="video/mp4" />
    </video>

    <!-- 4. 집 이동 비디오 -->
    <video id="homeTransitionVideo" class="fullscreen-video" muted playsinline preload="auto">
      <source src="winter z to home.mp4" type="video/mp4" />
    </video>

    <!-- 3. 의자 이동 비디오 (1회 재생) -->
    <video id="chairVideo" class="fullscreen-video" muted playsinline preload="auto">
      <source src="winter z to chair.mp4" type="video/mp4" />
    </video>

    <!-- 2. winter zooom 비디오 (한 번만 재생) -->
    <video id="zoomVideo" class="fullscreen-video" muted playsinline preload="auto">
      <source src="winter zooom.mp4" type="video/mp4" />
    </video>

    <!-- 1. 기본 배경 비디오 -->
    <video id="bgVideo" class="fullscreen-video" autoplay loop muted playsinline preload="auto">
      <source src="winter.mp4" type="video/mp4" />
      브라우저가 비디오 태그를 지원하지 않습니다.
    </video>

    <!-- Click 글래스모피즘 버튼 오버레이 -->
    <div class="content-overlay" id="overlay">
      <button class="pure-glass-btn" id="playBtn" aria-label="재생 버튼">
        Click
      </button>
    </div>

    <!-- 영상 종료 후 등장을 위해 초기 상태 hidden 부여 -->
    <button class="action-glass-btn hidden" id="leftBtn" aria-label="좌측 버튼"></button>
    <button class="action-glass-btn hidden" id="chairBtn" aria-label="우측 의자 위 버튼"></button>
  </div>

  <script>
    const bgVideo = document.getElementById('bgVideo');
    const zoomVideo = document.getElementById('zoomVideo');
    const chairVideo = document.getElementById('chairVideo');
    const homeTransitionVideo = document.getElementById('homeTransitionVideo');
    const snowVideo = document.getElementById('snowVideo');
    const playBtn = document.getElementById('playBtn');
    const overlay = document.getElementById('overlay');
    const homeBtn = document.getElementById('homeBtn');
    const leftBtn = document.getElementById('leftBtn');
    const chairBtn = document.getElementById('chairBtn');

    window.addEventListener('load', () => {
      zoomVideo.load();
      chairVideo.load();
      homeTransitionVideo.load();
      snowVideo.load();
    });

    // Click 버튼 클릭 시 winter zooom.mp4 재생
    if (playBtn) {
      playBtn.addEventListener('click', () => {
        if (overlay) overlay.classList.add('hidden');

        zoomVideo.classList.add('active');
        zoomVideo.currentTime = 0;

        zoomVideo.play().then(() => {
          const onFrame = () => {
            zoomVideo.removeEventListener('timeupdate', onFrame);
            bgVideo.classList.add('fade-out');
          };
          zoomVideo.addEventListener('timeupdate', onFrame);
        }).catch(err => console.error(err));
      });
    }

    // winter zooom 영상 종료 시 원형 버튼 2개 등장
    zoomVideo.addEventListener('ended', () => {
      zoomVideo.pause();
      
      if (leftBtn) leftBtn.classList.remove('hidden');
      if (chairBtn) chairBtn.classList.remove('hidden');
    });

    // 왼쪽 버튼 클릭 시 winter z to chair.mp4 재생
    if (leftBtn) {
      leftBtn.addEventListener('click', () => {
        if (leftBtn) leftBtn.classList.add('hidden');
        if (chairBtn) chairBtn.classList.add('hidden');

        chairVideo.style.transition = 'none';
        zoomVideo.style.transition = 'none';

        chairVideo.currentTime = 0;

        chairVideo.play().then(() => {
          const onFrame = () => {
            chairVideo.removeEventListener('timeupdate', onFrame);
            
            chairVideo.classList.add('active');
            zoomVideo.classList.remove('active');
            zoomVideo.pause();
          };
          chairVideo.addEventListener('timeupdate', onFrame);
        }).catch(err => console.error(err));
      });
    }

    // winter z to chair 영상 종료 시 정지
    chairVideo.addEventListener('ended', () => {
      chairVideo.pause();
    });

    // 오른쪽(의자) 버튼 클릭 시 winter z to home.mp4 재생
    if (chairBtn) {
      chairBtn.addEventListener('click', () => {
        if (leftBtn) leftBtn.classList.add('hidden');
        if (chairBtn) chairBtn.classList.add('hidden');

        homeTransitionVideo.style.transition = 'none';
        zoomVideo.style.transition = 'none';

        homeTransitionVideo.currentTime = 0;

        homeTransitionVideo.play().then(() => {
          const onFrame = () => {
            homeTransitionVideo.removeEventListener('timeupdate', onFrame);
            
            homeTransitionVideo.classList.add('active');
            zoomVideo.classList.remove('active');
            zoomVideo.pause();
          };
          homeTransitionVideo.addEventListener('timeupdate', onFrame);
        }).catch(err => console.error(err));
      });
    }

    // winter z to home 영상 종료 직후 winter snow.mp4 무한 루프 시작
    homeTransitionVideo.addEventListener('ended', () => {
      snowVideo.style.transition = 'none';
      homeTransitionVideo.style.transition = 'none';
      
      snowVideo.currentTime = 0;

      snowVideo.play().then(() => {
        const onFrame = () => {
          snowVideo.removeEventListener('timeupdate', onFrame);
          
          snowVideo.classList.add('active');
          homeTransitionVideo.classList.remove('active');
          homeTransitionVideo.pause();
        };
        snowVideo.addEventListener('timeupdate', onFrame);
      }).catch(err => console.error(err));
    });

    if (homeBtn) {
      homeBtn.addEventListener('click', () => {
        window.location.href = 'new main.html#gallerySection';
      });
    }
  </script>

</body>
</html>
