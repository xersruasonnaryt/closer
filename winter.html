<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>하얗게 눈 내리는 정원</title>

  <!-- Pretendard 폰트 추가 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden; /* 스크롤바 제거 */
      background-color: #000; /* 비디오 로딩 전/여백 기본 배경색 */
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    /* 비디오 컨테이너 및 비디오 스타일 */
    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .fullscreen-video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      /* 화면 비율에 맞춰 여백 없이 꽉 채우기 */
      object-fit: cover; 
      transform: translate(-50%, -50%);
      will-change: opacity;
    }

    /* 1. 기본 배경 영상 (winter.mp4) */
    #bgVideo {
      z-index: 1;
      opacity: 1;
      transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }

    #bgVideo.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* 2. 의자 이동 영상 (winter to chair.mp4) */
    #chairVideo {
      z-index: 2;
      opacity: 0;
    }

    /* 버튼 선택 시 전환될 최상단 영상 */
    #chairVideo.active {
      z-index: 5;
      opacity: 1;
    }

    /* 비디오 위에 얹어질 콘텐츠 영역 */
    .content-overlay {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      pointer-events: none; /* 클릭 이벤트가 비디오로 통과하도록 설정 */
    }

    .content-overlay h1 {
      font-size: 3rem;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
    }

    /* ==========================================
       여리한 홀로그램 글래스모피즘 원형 버튼 스타일
    ========================================== */
    .action-glass-btn {
      position: absolute;
      z-index: 20;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      outline: none;
      user-select: none;
      pointer-events: auto;
      
      /* 1. 극도의 블러 및 투명도 처리 */
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);

      /* 2. 여리한 반사광 레인보우/로즈골드 미세 틴트 그라데이션 */
      background: radial-gradient(
        circle at 30% 20%,
        rgba(255, 225, 235, 0.38) 0%,   /* 상단 좌측 여리한 피치 핑크 반사광 */
        rgba(215, 240, 255, 0.18) 45%,  /* 중앙 은은한 쿨 소다 블루 반사광 */
        rgba(255, 255, 255, 0.05) 75%,  /* 하단 매우 투명한 유리 바디 */
        rgba(255, 210, 240, 0.12) 100%  /* 하단 끝 여운의 보라빛 반사광 */
      );

      /* 3. 투명 입체 림 테두리 */
      border: 1px solid rgba(255, 255, 255, 0.45);

      /* 4. 여리한 오로라 광택 빛 그림자 & 몽환적 글로우 */
      box-shadow: 
        0 0 14px rgba(255, 215, 230, 0.28),    /* 은은한 핑크 글로우 */
        0 0 22px rgba(180, 235, 255, 0.22),    /* 은은한 블루 글로우 */
        0 6px 16px rgba(0, 0, 0, 0.25),        /* 기초 드롭 쉐도우 */
        inset 1.2px 1.5px 2px rgba(255, 255, 255, 0.9),  /* 상단 하이라이트 광택선 */
        inset -1.5px -2.5px 4px rgba(255, 200, 230, 0.3);  /* 하단 반사 굴절 빛 */

      opacity: 0.88;
      transform: translate(-50%, -50%) scale(1);
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .action-glass-btn.hidden {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: translate(-50%, -50%) scale(0.7) !important;
    }

    /* 버튼 마우스 호버 */
    .action-glass-btn:hover {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.18);
      border-color: rgba(255, 255, 255, 0.75);

      background: radial-gradient(
        circle at 30% 20%,
        rgba(255, 230, 242, 0.55) 0%,
        rgba(200, 242, 255, 0.3) 50%,
        rgba(255, 255, 255, 0.12) 80%,
        rgba(240, 210, 255, 0.25) 100%
      );

      box-shadow: 
        0 0 20px rgba(255, 205, 225, 0.5),
        0 0 30px rgba(175, 235, 255, 0.4),
        0 8px 24px rgba(0, 0, 0, 0.3),
        inset 1.5px 2px 3px rgba(255, 255, 255, 1),
        inset -2px -2.5px 6px rgba(255, 180, 220, 0.45);
    }

    /* 버튼 클릭 시 반응 인터랙션 */
    .action-glass-btn:active {
      transform: translate(-50%, -50%) scale(0.92);
    }

    /* 1. 좌측 중앙 버튼 위치 */
    #leftBtn {
      top: 50%;
      left: 20%;
    }

    /* 2. 우측 중앙 (의자 위) 버튼 위치 수정: top: 70%, left: 65% */
    #chairBtn {
      top: 68%;
      left: 68%;
    }

    .home-glass-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 50;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.05) 60%, rgba(255, 255, 255, 0.15) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow:
        0 0 12px rgba(255, 255, 255, 0.2),
        2px 6px 14px rgba(0, 0, 0, 0.15),
        inset 1px 1px 2px rgba(255, 255, 255, 0.8),
        inset -1px -1px 4px rgba(255, 255, 255, 0.2);
      cursor: pointer;
      outline: none;
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      pointer-events: auto;
    }

    .home-glass-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
      transition: transform 0.3s ease;
    }

    .home-glass-btn:hover {
      transform: scale(1.1);
      box-shadow:
        0 0 16px rgba(255, 255, 255, 0.4),
        4px 8px 20px rgba(0, 0, 0, 0.2),
        inset 1px 1.5px 3px rgba(255, 255, 255, 0.95);
    }

    .home-glass-btn:hover svg {
      transform: scale(1.08);
    }

    .home-glass-btn:active {
      transform: scale(0.92);
    }

  </style>
</head>
<body>

  <div class="video-container">

    <button id="homeBtn" class="home-glass-btn" aria-label="메인 화면 세 번째 섹션으로 이동">

      <svg viewBox="0 0 24 24">

        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>

        <polyline points="9 22 9 12 15 12 15 22"></polyline>

      </svg>

    </button>
    <!-- 의자 이동 비디오 -->
    <video id="chairVideo" class="fullscreen-video" muted playsinline preload="auto">
      <source src="winter to chair.mp4" type="video/mp4" />
    </video>

    <!-- 기본 배경 비디오 -->
    <video id="bgVideo" class="fullscreen-video" autoplay loop muted playsinline preload="auto">
      <source src="winter.mp4" type="video/mp4" />
      브라우저가 비디오 태그를 지원하지 않습니다.
    </video>

    <div class="content-overlay">
      <!-- <h1>원하는 문구를 입력하세요</h1> -->
    </div>

    <!-- 여리한 홀로그램 반사광 글래스모피즘 원형 버튼 2개 -->
    <button class="action-glass-btn" id="leftBtn" aria-label="좌측 버튼"></button>
    <button class="action-glass-btn" id="chairBtn" aria-label="우측 의자 위 버튼"></button>
  </div>

  <script>
    const bgVideo = document.getElementById('bgVideo');
    const chairVideo = document.getElementById('chairVideo');
    const leftBtn = document.getElementById('leftBtn');
    const chairBtn = document.getElementById('chairBtn');

    window.addEventListener('load', () => {
      chairVideo.load();
    });

    // 좌측 버튼 클릭 이벤트
    leftBtn.addEventListener('click', () => {
      console.log('좌측 버튼이 클릭되었습니다.');
    });

    // 우측 의자 위 버튼 클릭 -> winter to chair.mp4 재생
    chairBtn.addEventListener('click', () => {
      // 버튼 클릭 시 화면의 버튼들 숨김
      leftBtn.classList.add('hidden');
      chairBtn.classList.add('hidden');

      // 1. chairVideo 최상단 레이어로 활성화 (z-index: 5)
      chairVideo.classList.add('active');
      chairVideo.currentTime = 0;

      // 2. 영상 재생 시작 및 프레임 렌더링 확인 후 기존 배경 페이드아웃
      chairVideo.play().then(() => {
        const onFrame = () => {
          chairVideo.removeEventListener('timeupdate', onFrame);
          bgVideo.classList.add('fade-out');
        };
        chairVideo.addEventListener('timeupdate', onFrame);
      }).catch(err => console.error(err));
    });

    // 영상 재생 종료 시 멈춤 처리 (검은 화면 방지)
    chairVideo.addEventListener('ended', () => {
      chairVideo.pause();
    });
  </script>

  <script>
    const detailHomeBtn = document.getElementById('homeBtn');
    if (detailHomeBtn) {
      detailHomeBtn.addEventListener('click', () => {
        window.location.href = 'new main.html#gallerySection';
      });
    }
  </script>

</body>
</html>
