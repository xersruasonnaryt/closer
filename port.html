<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>바람이 불어오는 한적한 포구</title>
  
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .fullscreen-video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      object-fit: cover; 
      transform: translate(-50%, -50%);
      will-change: opacity, transform;
      filter: contrast(102%) brightness(99%) saturate(102%);
      
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .fullscreen-video.active {
      opacity: 1;
      visibility: visible;
    }

    /* 비디오 레이어 순서 */
    #bgVideo { z-index: 1; }
    #zoomVideo { z-index: 2; }
    #villageVideo { z-index: 3; }

    /* Click 위치 조절 레이어 */
    .content-overlay {
      position: absolute;
      z-index: 30; 
      pointer-events: none;
      top: 80%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .content-overlay.hidden {
      opacity: 0;
      transform: translate(-50%, -40%) scale(0.9);
      pointer-events: none;
    }

    /* 글래스모피즘 버튼 */
    .pure-glass-btn {
      pointer-events: auto;
      width: 80px;
      height: 32px;
      border-radius: 20px;
      font-family: 'Pretendard', sans-serif;
      font-weight: 500; 
      font-size: 12.5px;
      color: #ffffff;      
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.25); 
      letter-spacing: -0.2px;
      display: inline-flex; 
      justify-content: center; 
      align-items: center;
      padding: 0;
      position: relative;

      background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.02) 55%, rgba(255, 255, 255, 0.08) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 
        0 0 10px rgba(255, 200, 220, 0.15), 
        0 0 15px rgba(160, 230, 255, 0.15), 
        2px 5px 12px rgba(0, 0, 0, 0.1), 
        inset 1px 1px 1.5px rgba(255, 255, 255, 0.8), 
        inset -1px -1.5px 4px rgba(255, 255, 255, 0.2);

      cursor: pointer; 
      outline: none;
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      overflow: hidden; 
      user-select: none;
    }

    .pure-glass-btn::before {
      content: '';
      position: absolute;
      top: -1px; left: -1px; right: -1px; bottom: -1px;
      border-radius: 20px;
      background: conic-gradient(
        from 130deg at 50% 50%, 
        rgba(255, 180, 210, 0.2) 0deg, 
        rgba(255, 235, 170, 0.25) 70deg, 
        rgba(150, 240, 210, 0.25) 150deg, 
        rgba(140, 210, 255, 0.2) 230deg, 
        rgba(220, 180, 255, 0.2) 300deg, 
        rgba(255, 180, 210, 0.2) 360deg
      );
      -webkit-mask: radial-gradient(circle, transparent 60%, #000 70%);
      mask: radial-gradient(circle, transparent 60%, #000 70%);
      pointer-events: none; 
      opacity: 0.6;
      filter: blur(1.5px);
    }

    .pure-glass-btn::after {
      content: '';
      position: absolute;
      top: 8%; left: 12%;
      width: 38%; height: 35%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0.15) 50%, transparent 80%);
      transform: rotate(-15deg);
      pointer-events: none; 
      filter: blur(0.5px);
    }

    .pure-glass-btn:hover {
      transform: scale(1.05);
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 
        0 0 14px rgba(255, 180, 220, 0.25), 
        0 0 20px rgba(150, 220, 255, 0.25), 
        3px 8px 16px rgba(0, 0, 0, 0.12), 
        inset 1px 1.5px 3px rgba(255, 255, 255, 0.9), 
        inset -1px -2px 6px rgba(255, 255, 255, 0.3);
    }

    .pure-glass-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div class="video-container">
      <!-- 1. 기본 배경 영상 (무한 루프) -->
      <video id="bgVideo" class="fullscreen-video active" autoplay loop muted playsinline preload="auto">
        <source src="port.mp4" type="video/mp4" />
      </video>

      <!-- 2. Click 시 1회 재생되는 줌 영상 (loop 제거) -->
      <video id="zoomVideo" class="fullscreen-video" muted playsinline preload="auto">
        <source src="port zoom.mp4" type="video/mp4" />
      </video>

      <!-- 3. 두 번째 영상 종료 후 무한 루프로 재생될 마을 영상 (loop 적용) -->
      <video id="villageVideo" class="fullscreen-video" loop muted playsinline preload="auto">
        <source src="port z to village.mp4" type="video/mp4" />
      </video>

      <!-- Click 버튼 오버레이 -->
      <div class="content-overlay" id="overlay">
        <button class="pure-glass-btn" id="playBtn" aria-label="재생 버튼">
          Click
        </button>
      </div>
    </div>

    <script>
      (function initPortPage() {
        const bgVideo = document.getElementById('bgVideo');
        const zoomVideo = document.getElementById('zoomVideo');
        const villageVideo = document.getElementById('villageVideo');
        const playBtn = document.getElementById('playBtn');
        const overlay = document.getElementById('overlay');

        if (bgVideo) bgVideo.load();
        if (zoomVideo) zoomVideo.load();
        if (villageVideo) villageVideo.load();

        // 비디오 매끄러운 전환 함수
        function switchVideoSeamlessly(currentVid, nextVid) {
          nextVid.currentTime = 0;

          const onPlaying = () => {
            nextVid.removeEventListener('playing', onPlaying);
            nextVid.classList.add('active');

            setTimeout(() => {
              currentVid.classList.remove('active');
              currentVid.pause();
            }, 300);
          };

          nextVid.addEventListener('playing', onPlaying);

          const playPromise = nextVid.play();
          if (playPromise !== undefined) {
            playPromise.catch(() => {
              nextVid.classList.add('active');
              currentVid.classList.remove('active');
              currentVid.pause();
            });
          }
        }

        // 버튼 클릭 -> 두 번째 영상(port zoom) 재생
        if (playBtn) {
          playBtn.addEventListener('click', () => {
            overlay.classList.add('hidden');
            switchVideoSeamlessly(bgVideo, zoomVideo);
          });
        }

        // 두 번째 영상 종료 -> 세 번째 영상(port z to village) 무한 루프 재생
        if (zoomVideo) {
          zoomVideo.addEventListener('ended', () => {
            switchVideoSeamlessly(zoomVideo, villageVideo);
          });
        }
      })();
    </script>
  </div>

</body>
</html>
