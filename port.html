<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>바람이 불어오는 한적한 포구</title>
  
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .fullscreen-video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      object-fit: cover; 
      transform: translate(-50%, -50%);
      will-change: opacity, transform;
      filter: contrast(102%) brightness(99%) saturate(102%);
      
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .fullscreen-video.active {
      opacity: 1;
      visibility: visible;
    }

    /* 비디오 레이어 순서 */
    #bgVideo { z-index: 1; }
    #zoomVideo { z-index: 2; }
    #villageVideo { z-index: 3; }
    #shopVideo { z-index: 4; }
    #wallVideo { z-index: 5; }
    #wallLoopVideo { z-index: 6; }

    /* Click 위치 조절 레이어 */
    .content-overlay {
      position: absolute;
      z-index: 30; 
      pointer-events: none;
      top: 86%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .content-overlay.hidden {
      opacity: 0;
      transform: translate(-50%, -40%) scale(0.9);
      pointer-events: none;
    }

    /* 타원형 글래스모피즘 Click 버튼 스타일 */
    .pure-glass-btn {
      pointer-events: auto;
      width: 80px;
      height: 32px;
      border-radius: 20px;
      font-family: 'Pretendard', sans-serif;
      font-weight: 500; 
      font-size: 12.5px;
      color: #ffffff;      
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.25); 
      letter-spacing: -0.2px;
      display: inline-flex; 
      justify-content: center; 
      align-items: center;
      padding: 0;
      position: relative;

      background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.02) 55%, rgba(255, 255, 255, 0.08) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 
        0 0 10px rgba(255, 200, 220, 0.15), 
        0 0 15px rgba(160, 230, 255, 0.15), 
        2px 5px 12px rgba(0, 0, 0, 0.1), 
        inset 1px 1px 1.5px rgba(255, 255, 255, 0.8), 
        inset -1px -1.5px 4px rgba(255, 255, 255, 0.2);

      cursor: pointer; 
      outline: none;
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      overflow: hidden; 
      user-select: none;
    }

    .pure-glass-btn::before {
      content: '';
      position: absolute;
      top: -1px; left: -1px; right: -1px; bottom: -1px;
      border-radius: 20px;
      background: conic-gradient(
        from 130deg at 50% 50%, 
        rgba(255, 180, 210, 0.2) 0deg, 
        rgba(255, 235, 170, 0.25) 70deg, 
        rgba(150, 240, 210, 0.25) 150deg, 
        rgba(140, 210, 255, 0.2) 230deg, 
        rgba(220, 180, 255, 0.2) 300deg, 
        rgba(255, 180, 210, 0.2) 360deg
      );
      -webkit-mask: radial-gradient(circle, transparent 60%, #000 70%);
      mask: radial-gradient(circle, transparent 60%, #000 70%);
      pointer-events: none; 
      opacity: 0.6;
      filter: blur(1.5px);
    }

    .pure-glass-btn::after {
      content: '';
      position: absolute;
      top: 8%; left: 12%;
      width: 38%; height: 35%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0.15) 50%, transparent 80%);
      transform: rotate(-15deg);
      pointer-events: none; 
      filter: blur(0.5px);
    }

    .pure-glass-btn:hover {
      transform: scale(1.05);
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 
        0 0 14px rgba(255, 180, 220, 0.25), 
        0 0 20px rgba(150, 220, 255, 0.25), 
        3px 8px 16px rgba(0, 0, 0, 0.12), 
        inset 1px 1.5px 3px rgba(255, 255, 255, 0.9), 
        inset -1px -2px 6px rgba(255, 255, 255, 0.3);
    }

    .pure-glass-btn:active {
      transform: scale(0.95);
    }

    /* 원형 글래스모피즘 선택 버튼 공통 디자인 */
    .pure-glass-circle-btn {
      position: absolute;
      z-index: 40;
      pointer-events: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;

      background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.04) 55%, rgba(255, 255, 255, 0.12) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow: 
        0 0 10px rgba(255, 200, 220, 0.2), 
        0 0 14px rgba(160, 230, 255, 0.2), 
        2px 5px 12px rgba(0, 0, 0, 0.12), 
        inset 1px 1px 2px rgba(255, 255, 255, 0.85), 
        inset -1px -1.5px 4px rgba(255, 255, 255, 0.25);

      cursor: pointer;
      outline: none;
      opacity: 0;
      transition: opacity 0.6s ease, transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.4s ease, box-shadow 0.4s ease;
      overflow: hidden;
      user-select: none;
    }

    .pure-glass-circle-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #leftBtn {
      top: 50%;
      left: 34%;
      transform: translate(-50%, -50%);
    }

    #rightBtn {
      top: 79%;
      left: 86%;
      transform: translate(-50%, -50%);
    }

    .pure-glass-circle-btn::before {
      content: '';
      position: absolute;
      top: -1px; left: -1px; right: -1px; bottom: -1px;
      border-radius: 50%;
      background: conic-gradient(
        from 130deg at 50% 50%, 
        rgba(255, 180, 210, 0.3) 0deg, 
        rgba(255, 235, 170, 0.35) 70deg, 
        rgba(150, 240, 210, 0.35) 150deg, 
        rgba(140, 210, 255, 0.3) 230deg, 
        rgba(220, 180, 255, 0.3) 300deg, 
        rgba(255, 180, 210, 0.3) 360deg
      );
      -webkit-mask: radial-gradient(circle, transparent 55%, #000 68%);
      mask: radial-gradient(circle, transparent 55%, #000 68%);
      pointer-events: none;
      opacity: 0.75;
      filter: blur(1.2px);
    }

    .pure-glass-circle-btn::after {
      content: '';
      position: absolute;
      top: 10%; left: 15%;
      width: 40%; height: 38%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.2) 50%, transparent 80%);
      transform: rotate(-20deg);
      pointer-events: none;
      filter: blur(0.5px);
    }

    #leftBtn:hover, #rightBtn:hover {
      transform: translate(-50%, -50%) scale(1.12);
      border-color: rgba(255, 255, 255, 0.75);
      box-shadow: 
        0 0 14px rgba(255, 180, 220, 0.35), 
        0 0 20px rgba(150, 220, 255, 0.35), 
        3px 8px 16px rgba(0, 0, 0, 0.16), 
        inset 1.5px 1.5px 3px rgba(255, 255, 255, 0.95), 
        inset -1.5px -2px 5px rgba(255, 255, 255, 0.35);
    }

    #leftBtn:active, #rightBtn:active {
      transform: translate(-50%, -50%) scale(0.92);
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div class="video-container">
      <!-- 1. 기본 배경 영상 (무한 루프) -->
      <video id="bgVideo" class="fullscreen-video active" autoplay loop muted playsinline preload="auto">
        <source src="port.mp4" type="video/mp4" />
      </video>

      <!-- 2. Click 시 1회 재생되는 줌 영상 -->
      <video id="zoomVideo" class="fullscreen-video" muted playsinline preload="auto">
        <source src="port zoom.mp4" type="video/mp4" />
      </video>

      <!-- 3. 마을 영상 (무한 루프) -->
      <video id="villageVideo" class="fullscreen-video" loop muted playsinline preload="auto">
        <source src="port z to village.mp4" type="video/mp4" />
      </video>

      <!-- 4. 오른쪽 버튼 클릭 시 1회 재생 후 정지하는 가게 영상 -->
      <video id="shopVideo" class="fullscreen-video" muted playsinline preload="auto">
        <source src="port z to shop.mp4" type="video/mp4" />
      </video>

      <!-- 5. 왼쪽 버튼 클릭 시 1회 재생되는 벽 이동 영상 -->
      <video id="wallVideo" class="fullscreen-video" muted playsinline preload="auto">
        <source src="port z to wall.mp4" type="video/mp4" />
      </video>

      <!-- 6. 벽 이동 영상 종료 후 연결되는 벽 무한 루프 영상 -->
      <video id="wallLoopVideo" class="fullscreen-video" loop muted playsinline preload="auto">
        <source src="port wall.mp4" type="video/mp4" />
      </video>

      <audio id="hornAmbience" preload="auto" aria-hidden="true">
        <source src="https://cdn.pixabay.com/audio/2022/03/10/audio_39ffd1c0d0.mp3" type="audio/mpeg" />
      </audio>
      <audio id="waveAmbience" loop preload="auto" aria-hidden="true">
        <source src="https://cdn.pixabay.com/audio/2024/10/12/audio_7dd52a2e33.mp3" type="audio/mpeg" />
      </audio>
      <audio id="crowdAmbience" loop preload="auto" aria-hidden="true">
        <source src="https://cdn.pixabay.com/audio/2022/03/14/audio_b34d1e62d3.mp3" type="audio/mpeg" />
      </audio>
      <audio id="flagAmbience" loop preload="auto" aria-hidden="true">
        <source src="https://cdn.pixabay.com/audio/2026/03/01/audio_1ff3c8dd71.mp3" type="audio/mpeg" />
      </audio>
      <audio id="windAmbience" loop preload="auto" aria-hidden="true">
        <source src="https://cdn.pixabay.com/audio/2025/12/28/audio_51b7de1a9f.mp3" type="audio/mpeg" />
      </audio>

      <!-- Click 버튼 오버레이 -->
      <div class="content-overlay" id="overlay">
        <button class="pure-glass-btn" id="playBtn" aria-label="재생 버튼">
          Click
        </button>
      </div>

      <!-- 세 번째 영상 재생 후 등장할 원형 글래스모피즘 버튼 -->
      <button class="pure-glass-circle-btn" id="leftBtn" aria-label="왼쪽 선택 버튼"></button>
      <button class="pure-glass-circle-btn" id="rightBtn" aria-label="오른쪽 선택 버튼"></button>
    </div>

    <script>
      (function initPortPage() {
        const bgVideo = document.getElementById('bgVideo');
        const zoomVideo = document.getElementById('zoomVideo');
        const villageVideo = document.getElementById('villageVideo');
        const shopVideo = document.getElementById('shopVideo');
        const wallVideo = document.getElementById('wallVideo');
        const wallLoopVideo = document.getElementById('wallLoopVideo');
        const playBtn = document.getElementById('playBtn');
        const overlay = document.getElementById('overlay');
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        const hornAmbience = document.getElementById('hornAmbience');
        const waveAmbience = document.getElementById('waveAmbience');
        const crowdAmbience = document.getElementById('crowdAmbience');
        const flagAmbience = document.getElementById('flagAmbience');
        const windAmbience = document.getElementById('windAmbience');

        if (bgVideo) bgVideo.load();
        if (zoomVideo) zoomVideo.load();
        if (villageVideo) villageVideo.load();
        if (shopVideo) shopVideo.load();
        if (wallVideo) wallVideo.load();
        if (wallLoopVideo) wallLoopVideo.load();

        const portAudioTracks = {
          horn: hornAmbience,
          wave: waveAmbience,
          crowd: crowdAmbience,
          flag: flagAmbience,
          wind: windAmbience
        };

        const portAudioMixes = {
          full: { horn: 0.20, wave: 0.20, crowd: 0.15, flag: 0.13, wind: 0.10 },
          wall: { horn: 0, wave: 0.24, crowd: 0, flag: 0.18, wind: 0.14 },
          shop: { horn: 0.26, wave: 0, crowd: 0.19, flag: 0, wind: 0 }
        };

        const audioFadeJobs = new Map();
        const AUDIO_FADE_OUT_MS = 1800;
        let currentPortAudioMode = 'full';
        let portAudioMixApplied = false;
        let hornTimer = null;

        function safelyPlayAudio(audio, restart = false) {
          if (!audio) return;
          if (restart) audio.currentTime = 0;
          const playPromise = audio.play();
          if (playPromise !== undefined) {
            playPromise.catch(() => {
              // 유음 자동 재생이 차단되면 첫 사용자 입력에서 다시 시도합니다.
            });
          }
        }

        function cancelAudioFade(audio) {
          const job = audioFadeJobs.get(audio);
          if (!job) return;
          cancelAnimationFrame(job.rafId);
          audioFadeJobs.delete(audio);
        }

        function fadeAudioTo(audio, targetVolume, duration, pauseAtZero = false) {
          if (!audio) return;
          cancelAudioFade(audio);

          const target = Math.max(0, Math.min(1, targetVolume));
          if (target > 0 && audio.paused) safelyPlayAudio(audio);

          if (pauseAtZero && audio.paused) {
            audio.volume = 0;
            audio.currentTime = 0;
            return;
          }

          const startVolume = Number.isFinite(audio.volume) ? audio.volume : 0;
          if (duration <= 0 || Math.abs(startVolume - target) < 0.001) {
            audio.volume = target;
            if (pauseAtZero && target === 0) {
              audio.pause();
              audio.currentTime = 0;
            }
            return;
          }

          const startedAt = performance.now();
          const job = { rafId: 0 };
          audioFadeJobs.set(audio, job);

          const tick = (now) => {
            if (audioFadeJobs.get(audio) !== job) return;

            const progress = Math.min((now - startedAt) / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            audio.volume = startVolume + (target - startVolume) * eased;

            if (progress < 1) {
              job.rafId = requestAnimationFrame(tick);
              return;
            }

            audioFadeJobs.delete(audio);
            audio.volume = target;
            if (pauseAtZero && target === 0) {
              audio.pause();
              audio.currentTime = 0;
            }
          };

          job.rafId = requestAnimationFrame(tick);
        }

        function clearHornTimer() {
          if (hornTimer !== null) {
            clearTimeout(hornTimer);
            hornTimer = null;
          }
        }

        function scheduleNextHorn() {
          clearHornTimer();
          if (!portAudioMixes[currentPortAudioMode].horn) return;

          const delay = 35000 + Math.random() * 20000;
          hornTimer = setTimeout(() => {
            const hornVolume = portAudioMixes[currentPortAudioMode].horn;
            if (!hornVolume) return;

            cancelAudioFade(hornAmbience);
            hornAmbience.volume = hornVolume;
            safelyPlayAudio(hornAmbience, true);
            scheduleNextHorn();
          }, delay);
        }

        function enableHorn(targetVolume, initial = false) {
          clearHornTimer();
          cancelAudioFade(hornAmbience);

          if (hornAmbience.paused || hornAmbience.ended) {
            hornAmbience.currentTime = 0;
            hornAmbience.volume = initial ? 0 : targetVolume;
            safelyPlayAudio(hornAmbience);
          }

          fadeAudioTo(hornAmbience, targetVolume, initial ? 900 : 550);
          scheduleNextHorn();
        }

        function resumeCurrentPortAudio() {
          const targets = portAudioMixes[currentPortAudioMode];

          Object.entries(portAudioTracks).forEach(([name, audio]) => {
            const target = targets[name] || 0;
            if (!target || name === 'horn') return;

            if (audio.paused) {
              cancelAudioFade(audio);
              audio.volume = target;
              safelyPlayAudio(audio);
            }
          });

          if (targets.horn) enableHorn(targets.horn);
        }

        function applyPortAudioMode(mode, initial = false) {
          if (!portAudioMixes[mode]) return;

          if (portAudioMixApplied && currentPortAudioMode === mode) {
            resumeCurrentPortAudio();
            return;
          }

          currentPortAudioMode = mode;
          portAudioMixApplied = true;
          const targets = portAudioMixes[mode];

          Object.entries(portAudioTracks).forEach(([name, audio]) => {
            const target = targets[name] || 0;

            if (name === 'horn') {
              if (target > 0) {
                enableHorn(target, initial);
              } else {
                clearHornTimer();
                fadeAudioTo(audio, 0, AUDIO_FADE_OUT_MS, true);
              }
              return;
            }

            if (target > 0) {
              if (initial && audio.paused) audio.volume = 0;
              if (audio.paused) safelyPlayAudio(audio);
              fadeAudioTo(audio, target, initial ? 900 : 550);
            } else {
              fadeAudioTo(audio, 0, AUDIO_FADE_OUT_MS, true);
            }
          });
        }

        function unlockPortAudio() {
          resumeCurrentPortAudio();
          document.removeEventListener('pointerdown', unlockPortAudio, true);
          document.removeEventListener('keydown', unlockPortAudio, true);
        }

        // 허용된 브라우저에서는 진입 즉시 재생하고, 차단되면 첫 입력에서 재시도합니다.
        applyPortAudioMode('full', true);
        document.addEventListener('pointerdown', unlockPortAudio, true);
        document.addEventListener('keydown', unlockPortAudio, true);

        // 비디오 매끄러운 전환 함수
        function switchVideoSeamlessly(currentVid, nextVid, onComplete) {
          nextVid.currentTime = 0;

          const onPlaying = () => {
            nextVid.removeEventListener('playing', onPlaying);
            nextVid.classList.add('active');

            setTimeout(() => {
              currentVid.classList.remove('active');
              currentVid.pause();
              if (onComplete) onComplete();
            }, 300);
          };

          nextVid.addEventListener('playing', onPlaying);

          const playPromise = nextVid.play();
          if (playPromise !== undefined) {
            playPromise.catch(() => {
              nextVid.classList.add('active');
              currentVid.classList.remove('active');
              currentVid.pause();
              if (onComplete) onComplete();
            });
          }
        }

        // 버튼 클릭 -> 두 번째 영상(port zoom) 재생
        if (playBtn) {
          playBtn.addEventListener('click', () => {
            resumeCurrentPortAudio();
            overlay.classList.add('hidden');
            switchVideoSeamlessly(bgVideo, zoomVideo);
          });
        }

        // 두 번째 영상 종료 -> 세 번째 영상(port z to village) 재생 및 버튼 노출
        if (zoomVideo) {
          zoomVideo.addEventListener('ended', () => {
            switchVideoSeamlessly(zoomVideo, villageVideo, () => {
              setTimeout(() => {
                if (leftBtn) leftBtn.classList.add('visible');
                if (rightBtn) rightBtn.classList.add('visible');
              }, 300);
            });
          });
        }

        // 왼쪽 버튼 클릭 -> 두 원형 버튼 숨기기 & 다섯 번째 영상(port z to wall) 1회 재생
        if (leftBtn) {
          leftBtn.addEventListener('click', () => {
            applyPortAudioMode('wall');
            if (leftBtn) leftBtn.classList.remove('visible');
            if (rightBtn) rightBtn.classList.remove('visible');
            switchVideoSeamlessly(villageVideo, wallVideo);
          });
        }

        // 오른쪽 버튼 클릭 -> 두 원형 버튼 숨기기 & 네 번째 영상(port z to shop) 1회 재생
        if (rightBtn) {
          rightBtn.addEventListener('click', () => {
            applyPortAudioMode('shop');
            if (leftBtn) leftBtn.classList.remove('visible');
            if (rightBtn) rightBtn.classList.remove('visible');
            switchVideoSeamlessly(villageVideo, shopVideo);
          });
        }

        // 네 번째 영상(shop) 재생 완료 시 일시정지 (마지막 프레임 고정)
        if (shopVideo) {
          shopVideo.addEventListener('ended', () => {
            shopVideo.pause();
          });
        }

        // 다섯 번째 영상(wall) 재생 완료 시 여섯 번째 루프 영상(port wall)으로 전환
        if (wallVideo) {
          wallVideo.addEventListener('ended', () => {
            switchVideoSeamlessly(wallVideo, wallLoopVideo);
          });
        }
      })();
    </script>
  </div>

</body>
</html>
